services:
  - type: web
    name: qemma-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: apps/api
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: SUPABASE_URL
        value: https://kreuvfphivdwpijqbxlt.supabase.co
      - key: CORS_ALLOWED_ORIGINS
        value: https://qemma-erp.pages.dev
      - key: DATABASE_URL
        value: postgresql+asyncpg://qemma_app.kreuvfphivdwpijqbxlt:Qemma_Prod_2026_SecureDb!@aws-0-eu-central-1.pooler.supabase.com:5432/postgres

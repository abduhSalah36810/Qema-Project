name: CI

'on':
  push:
    branches:
      - main
      - setup/project-foundation
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - setup/project-foundation

permissions:
  contents: read

jobs:
  api:
    name: Backend API & Database Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qemma_dev
          POSTGRES_PASSWORD: changeme_local_only
          POSTGRES_DB: qemma_erp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run API test suite
        env:
          DATABASE_URL: postgresql+asyncpg://qemma_dev:changeme_local_only@localhost:5432/qemma_erp_dev
          APP_ENV: test
        run: pytest tests/ -v

      - name: Run Alembic database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://qemma_dev:changeme_local_only@localhost:5432/qemma_erp_dev
          APP_ENV: development
        run: |
          alembic upgrade head
          alembic current

      - name: Verify API startup, health, and database readiness
        env:
          DATABASE_URL: postgresql+asyncpg://qemma_dev:changeme_local_only@localhost:5432/qemma_erp_dev
          APP_ENV: development
        run: |
          python -m uvicorn app.main:app --port 8000 &
          UVICORN_PID=$!
          echo "Waiting for API to respond on http://localhost:8000/api/v1/health..."
          API_STARTED=0
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/api/v1/health > health.json; then
              echo "Health check succeeded:"
              cat health.json
              echo ""
              grep -q '"status":"ok"' health.json || { echo "Invalid health payload"; kill $UVICORN_PID; exit 1; }
              API_STARTED=1
              break
            fi
            sleep 1
          done

          if [ $API_STARTED -ne 1 ]; then
            echo "API failed to start within timeout"
            kill $UVICORN_PID 2>/dev/null || true
            exit 1
          fi

          echo "Verifying database readiness on http://localhost:8000/api/v1/ready..."
          if curl -s -f http://localhost:8000/api/v1/ready > ready.json; then
            echo "Readiness check succeeded:"
            cat ready.json
            echo ""
            grep -q '"status":"ready"' ready.json || { echo "Invalid readiness status"; kill $UVICORN_PID; exit 1; }
            grep -q '"database":"connected"' ready.json || { echo "Invalid database readiness payload"; kill $UVICORN_PID; exit 1; }
          else
            echo "Readiness check failed"
            kill $UVICORN_PID 2>/dev/null || true
            exit 1
          fi

          kill $UVICORN_PID
          wait $UVICORN_PID 2>/dev/null || true
          exit 0

  web:
    name: Frontend Web Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
